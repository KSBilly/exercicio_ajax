<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="#" id="avatar" alt=".">
            <h1 class="profile-name" id="name"></h1>
            <h2 class="profile-username" id="username"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="#" id="link" class="profile-link">Ver no Github</a>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
        const xhr = new XMLHttpRequest();
        const endpoint = 'https://api.github.com/users/ksbilly';

        xhr.open('GET', endpoint, true);

        const name = document.getElementById("name");
        const repos = document.getElementById("repos");
        const followers = document.getElementById("followers");
        const following = document.getElementById("following");
        const link = document.getElementById("link");
        const avatar = document.getElementById("avatar");

        xhr.onload = function() {
            try {
                if (xhr.status >= 200 && xhr.status < 300) {
                    const resposta = xhr.responseText;
                    const dados = JSON.parse(resposta);

                    name.innerText = dados.login;
                    repos.innerText = dados.public_repos;
                    followers.innerText = dados.followers;
                    following.innerText = dados.following;
                    link.href = dados.html_url;
                    avatar.src = dados.avatar_url;
                } else {
                    console.error("Erro na requisição: " + xhr.status);
                }
            } catch (error) {
                console.error("Erro ao processar os dados:", error);
            }
        };

        xhr.onerror = function() {
            console.error("Erro de rede ao tentar fazer a requisição.");
        };

        xhr.send();
    });
    </script>
</body>
</html>
